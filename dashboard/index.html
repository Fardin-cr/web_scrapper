<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SteamLens</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; background: #f5f5f5; color: #222 }
  h2   { margin-bottom: 16px; color: #333 }

  .controls { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
  button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; color: #fff }
  #btn-scrape { background: #5b21b6 }
  #btn-model  { background: #065f46 }
  #btn-export { background: #1e3a8a }
  #status { font-size: 13px; color: #555; margin-left: 8px }

  #count { font-size: 12px; color: #777; margin-bottom: 6px }

  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px }
  th { background: #e5e7eb; padding: 8px 10px; text-align: left; border: 1px solid #d1d5db; font-size: 12px }
  td { padding: 7px 10px; border: 1px solid #e5e7eb }
  tr:hover td { background: #f0f4ff }

  .pages { margin-top: 12px; display: flex; gap: 10px; align-items: center }
  .pg { padding: 5px 14px; border: 1px solid #999; background: #e5e7eb; border-radius: 4px; cursor: pointer; font-size: 13px; color: #333 }
  .pg:disabled { opacity: .4; cursor: not-allowed }
  .pg:not(:disabled):hover { background: #d1d5db }
</style>
</head>
<body>

<h2>&#9654; SteamLens — Steam Market Analysis</h2>

<div class="controls">
  <button id="btn-scrape" onclick="run('scrape')">Run Scraper</button>
  <button id="btn-model"  onclick="run('model')">Run Clustering Model</button>
  <button id="btn-export" onclick="exportCSV()">Export CSV</button>
  <span id="status"></span>
</div>

<div id="count"></div>

<table>
  <thead><tr>
    <th>Title</th><th>Genre</th><th>Price</th>
    <th>Rating</th><th>Reviews</th><th>Developer</th><th>Segment</th>
  </tr></thead>
  <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:30px;color:#999">Loading...</td></tr></tbody>
</table>
<div class="pages" id="pages"></div>

<script>
let ALL = [], curPage = 1;
const PAGE = 25;

window.onload = load;

async function load() {
  try {
    const r = await fetch('/api/data');
    ALL = await r.json();
    if (!Array.isArray(ALL)) ALL = [];
    render();
  } catch(e) {
    showMsg('No data yet — click Run Scraper first.');
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function render() {
  const total = ALL.length, totalPages = Math.max(1, Math.ceil(total / PAGE));
  curPage = Math.min(curPage, totalPages);
  const start = (curPage - 1) * PAGE, rows = ALL.slice(start, start + PAGE);
  document.getElementById('count').textContent =
    `Showing ${total ? start+1 : 0}–${Math.min(start+PAGE, total)} of ${total.toLocaleString()} games`;
  if (!rows.length) { showMsg('No data yet — click Run Scraper first.'); return; }
  document.getElementById('tbody').innerHTML = rows.map(d => `<tr>
    <td>${esc(d.title)}</td>
    <td>${esc(d.genre||'—')}</td>
    <td>${d.price === 0 ? 'Free' : '$' + Number(d.price).toFixed(2)}</td>
    <td>${esc(d.rating||'N/A')}</td>
    <td>${d.review_count > 0 ? Number(d.review_count).toLocaleString() : '—'}</td>
    <td>${esc(d.developer||'—')}</td>
    <td>${esc(d.segment||'—')}</td>
  </tr>`).join('');
  const el = document.getElementById('pages');
  el.innerHTML = totalPages > 1
    ? `<button class="pg" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>&#8249; Prev</button>
       <span style="font-size:13px;color:#555">Page ${curPage} of ${totalPages}</span>
       <button class="pg" onclick="goPage(${curPage+1})" ${curPage===totalPages?'disabled':''}>Next &#8250;</button>` : '';
}

function goPage(p) { curPage = p; render(); window.scrollTo(0,0) }
function showMsg(m) { document.getElementById('tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#999">${m}</td></tr>` }

async function run(type) {
  document.getElementById('status').textContent = 'Starting ' + type + '...';
  try {
    const r = await fetch('/api/' + type, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) { document.getElementById('status').textContent = 'Error: ' + (j.error||r.status); return; }
    document.getElementById('status').textContent = 'Running...';
    const poll = setInterval(async () => {
      try {
        const s = await (await fetch('/api/status')).json();
        if (!s.running && s.done) {
          clearInterval(poll);
          document.getElementById('status').textContent = s.error ? 'Error: ' + s.error : 'Done!';
          if (!s.error) await load();
        }
      } catch(_) {}
    }, 1500);
  } catch(e) { document.getElementById('status').textContent = 'Error: ' + e.message }
}

function exportCSV() {
  const a = document.createElement('a');
  a.href = '/api/export'; a.download = 'steam_games.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
</script>
</body>
</html>
